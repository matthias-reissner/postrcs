name: Extension CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    name: PostgreSQL ${{ matrix.pg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [16, 17, 18]
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL ${{ matrix.pg }}
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc |
            sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" |
            sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-${{ matrix.pg }} postgresql-server-dev-${{ matrix.pg }}
          if ! sudo pg_lsclusters --no-header | grep -Eq '^${{ matrix.pg }}[[:space:]]+main'; then
            sudo pg_createcluster ${{ matrix.pg }} main
          fi
          sudo pg_ctlcluster ${{ matrix.pg }} main start
          pg_version="${{ matrix.pg }}"
          pg_port=$(sudo pg_lsclusters --no-header |
            awk -v version="$pg_version" '$1 == version && $2 == "main" { print $3 }')
          if [ -z "$pg_port" ]; then
            echo "Could not determine the PostgreSQL $pg_version cluster port" >&2
            exit 1
          fi
          echo "PGPORT=$pg_port" >> "$GITHUB_ENV"
          sudo -u postgres createuser --port="$pg_port" --superuser "$USER"
      - name: Build and install
        run: |
          make PG_CONFIG=/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config
          sudo make install PG_CONFIG=/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config
      - name: Run regression tests
        run: make installcheck PG_CONFIG=/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config
      - name: Show regression differences
        if: failure()
        run: |
          if [ -f regression.diffs ]; then
            cat regression.diffs
          fi
